name: CI

on:
  # Changes are pushed straight to main, so check those as well as PRs
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # A stuck code generator once ran for 47 minutes; fail fast instead
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned to the version used locally so a new release can't break CI unannounced
          flutter-version: '3.47.4'
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
